name: CI

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actions:
    name: Check GH actions
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required to upload SARIF results
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '26'
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      # zizmor can't evaluate the `cache` expression below; release runs never cache
      - name: Install Node.js # zizmor: ignore[cache-poisoning]
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ github.event_name != 'release' && 'yarn' || '' }}
          package-manager-cache: false
      - run: yarn install --immutable
      - run: yarn lint
      - run: xvfb-run -a yarn test
      - run: yarn vsce-package
      - name: Validate package version matches git tag
        if: github.event_name == 'release'
        run: |
          PACKAGE_VERSION=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Error: Tag version ($GITHUB_REF_NAME) does not match package.json version (v$PACKAGE_VERSION)"
            exit 1
          fi
      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'release'
        with:
          name: vsix
          path: '*.vsix'
  release:
    if: github.event_name == 'release'
    needs:
      - actions
      - test
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - run: gh release upload "$GITHUB_REF_NAME" *.vsix
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npx @vscode/vsce publish --pat ${{ secrets.MARKETPLACE_TOKEN }} -i *.vsix
      - run: npx ovsx publish --trusted-publishing *.vsix
  check:
    if: always()
    needs:
      - actions
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
